<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>登录</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        var preference = localStorage.getItem('chat-demo:theme-preference')
        var dark =
          preference === 'dark' ||
          (preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (error) {}
    </script>
    <style>
      :root {
        --bg: #ffffff;
        --surface: #ffffff;
        --label-primary: #0f1115;
        --label-tertiary: #81858c;
        --label-caption: #adb2b8;
        --border-l2: rgba(0, 0, 0, 0.1);
        --border-l3: rgba(0, 0, 0, 0.16);
        --brand: #3964fe;
        --brand-hover: #5686fe;
        --brand-ring: rgba(57, 100, 254, 0.14);
        --danger: #ec1313;
        --danger-ring: rgba(236, 19, 19, 0.12);
        --shadow-input:
          0 4px 10px rgba(0, 0, 0, 0.02),
          0 2px 4px rgba(0, 0, 0, 0.04);
        --ease: cubic-bezier(0.4, 0, 0.2, 1);
        color-scheme: light;
      }

      html[data-theme='dark'] {
        --bg: #151517;
        --surface: #2c2c2e;
        --label-primary: #f9fafb;
        --label-tertiary: #adb2b8;
        --label-caption: #81858c;
        --border-l2: rgba(255, 255, 255, 0.12);
        --border-l3: rgba(255, 255, 255, 0.2);
        --brand: #5686fe;
        --brand-hover: #3964fe;
        --brand-ring: rgba(86, 134, 254, 0.22);
        --danger: #f25a5a;
        --danger-ring: rgba(242, 90, 90, 0.16);
        --shadow-input: none;
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        display: flex;
        min-height: 100vh;
        min-height: 100dvh;
        background-color: var(--bg);
        color: var(--label-primary);
        font-family:
          system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu,
          Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .page {
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 360px;
        margin: auto;
        padding: 48px 24px;
      }

      .brand {
        display: flex;
        justify-content: center;
        margin-bottom: 32px;
      }

      .brand svg {
        display: block;
        width: auto;
        height: 24px;
      }

      .brand svg path {
        fill: var(--brand);
      }

      .title {
        margin: 0 0 8px;
        font-size: 24px;
        line-height: 32px;
        font-weight: 600;
        text-align: center;
        color: var(--label-primary);
      }

      .subtitle {
        margin: 0 0 28px;
        font-size: 14px;
        line-height: 22px;
        text-align: center;
        color: var(--label-tertiary);
      }

      .field {
        display: flex;
        align-items: center;
        height: 48px;
        padding: 0 18px;
        margin-bottom: 12px;
        border: 1px solid var(--border-l2);
        border-radius: 24px;
        background-color: var(--surface);
        box-shadow: var(--shadow-input);
        transition:
          border-color 0.2s var(--ease),
          box-shadow 0.2s var(--ease),
          background-color 0.2s var(--ease);
      }

      .field:focus-within {
        border-color: var(--border-l3);
        box-shadow: 0 0 0 3px var(--brand-ring);
      }

      .field.invalid {
        border-color: var(--danger);
        box-shadow: 0 0 0 3px var(--danger-ring);
      }

      .field input {
        flex: 1;
        min-width: 0;
        height: 100%;
        padding: 0;
        border: none;
        outline: none;
        background: transparent;
        color: var(--label-primary);
        font: inherit;
        font-size: 16px;
        caret-color: var(--brand);
      }

      .field input::placeholder {
        color: var(--label-caption);
      }

      .error {
        min-height: 20px;
        margin: 8px 2px 12px;
        font-size: 12px;
        line-height: 20px;
        color: var(--danger);
      }

      .submit {
        width: 100%;
        height: 40px;
        padding: 0 16px;
        border: none;
        border-radius: 4096px;
        background-color: var(--brand);
        color: #ffffff;
        font: inherit;
        font-size: 14px;
        line-height: 22px;
        font-weight: 500;
        cursor: pointer;
        transition:
          background-color 0.2s var(--ease),
          opacity 0.2s var(--ease);
      }

      .submit:hover:not(:disabled) {
        background-color: var(--brand-hover);
      }

      .submit:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .submit:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px var(--brand-ring);
      }

      @media (max-width: 767px) {
        .page {
          padding: 40px 24px calc(24px + env(safe-area-inset-bottom));
        }

        .brand {
          margin-bottom: 28px;
        }

        .brand svg {
          height: 22px;
        }

        .title {
          font-size: 22px;
          line-height: 30px;
        }

        .subtitle {
          margin-bottom: 24px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="brand" aria-hidden="true"><!--WORDMARK--></div>
      <div id="panel" hidden>
        <h1 class="title" id="title">登录</h1>
        <p class="subtitle" id="subtitle">请输入访问密码以继续</p>
        <form id="form" novalidate>
          <div class="field" id="passwordField">
            <input
              id="password"
              type="password"
              autocomplete="current-password"
              spellcheck="false"
              placeholder="请输入密码"
              aria-label="请输入密码"
            />
          </div>
          <div class="field" id="confirmField" hidden>
            <input
              id="confirm"
              type="password"
              autocomplete="new-password"
              spellcheck="false"
              placeholder="请再次输入密码"
              aria-label="请再次输入密码"
            />
          </div>
          <div class="error" id="error" role="alert"></div>
          <button class="submit" id="submit" type="submit" disabled>登录</button>
        </form>
      </div>
    </main>
    <script>
      const messages = {
        'zh-CN': {
          documentTitle: '登录',
          title: '登录',
          subtitle: '请输入访问密码以继续',
          password: '请输入密码',
          confirm: '请再次输入密码',
          button: '登录',
          setupTitle: '设置访问密码',
          setupSubtitle: '首次使用，请设置访问密码',
          setupButton: '进入系统',
          mismatch: '两次输入的密码不一致',
          invalid: '密码错误，请重新输入',
          rateLimited: '尝试次数过多，请稍后再试',
          network: '网络异常，请稍后重试',
          setupFailed: '设置失败，请重试',
          working: '处理中…',
        },
        'en-US': {
          documentTitle: 'Sign in',
          title: 'Sign in',
          subtitle: 'Enter the access password to continue',
          password: 'Enter password',
          confirm: 'Confirm password',
          button: 'Sign in',
          setupTitle: 'Set an access password',
          setupSubtitle: 'First time here — create an access password',
          setupButton: 'Continue',
          mismatch: 'Passwords do not match',
          invalid: 'Incorrect password. Please try again.',
          rateLimited: 'Too many attempts. Please try again later.',
          network: 'Network error. Please try again.',
          setupFailed: 'Setup failed. Please try again.',
          working: 'Working…',
        },
      }

      let locale = 'zh-CN'
      try {
        locale = localStorage.getItem('chat-demo:locale') || navigator.language || 'zh-CN'
      } catch (error) {
        locale = navigator.language || 'zh-CN'
      }
      const text = locale.toLowerCase().startsWith('zh') ? messages['zh-CN'] : messages['en-US']

      const panel = document.getElementById('panel')
      const form = document.getElementById('form')
      const title = document.getElementById('title')
      const subtitle = document.getElementById('subtitle')
      const passwordField = document.getElementById('passwordField')
      const confirmField = document.getElementById('confirmField')
      const password = document.getElementById('password')
      const confirm = document.getElementById('confirm')
      const error = document.getElementById('error')
      const submit = document.getElementById('submit')

      let configured = true
      let submitting = false

      const updateSubmit = () => {
        submit.disabled =
          submitting || !password.value.trim() || (!configured && !confirm.value.trim())
      }

      const setError = (message, fields = [passwordField]) => {
        error.textContent = message
        for (const field of [passwordField, confirmField]) {
          const invalid = Boolean(message) && fields.includes(field)
          field.classList.toggle('invalid', invalid)
          field.querySelector('input').setAttribute('aria-invalid', invalid ? 'true' : 'false')
        }
      }

      const applyMode = () => {
        document.documentElement.lang = text === messages['zh-CN'] ? 'zh-CN' : 'en-US'
        document.title = text.documentTitle
        title.textContent = configured ? text.title : text.setupTitle
        subtitle.textContent = configured ? text.subtitle : text.setupSubtitle
        confirmField.hidden = configured
        password.placeholder = text.password
        password.setAttribute('aria-label', text.password)
        confirm.placeholder = text.confirm
        confirm.setAttribute('aria-label', text.confirm)
        password.autocomplete = configured ? 'current-password' : 'new-password'
        submit.textContent = configured ? text.button : text.setupButton
        updateSubmit()
      }

      const showPanel = () => {
        panel.hidden = false
        password.focus()
      }

      const refresh = async () => {
        try {
          const response = await fetch('/api/auth/status', {
            cache: 'no-store',
            headers: { accept: 'application/json' },
          })
          if (!response.ok) {
            throw new Error('status')
          }
          const state = await response.json()
          if (state.authenticated) {
            location.replace('/')
            return
          }
          configured = state.configured !== false
          applyMode()
          showPanel()
        } catch {
          configured = true
          applyMode()
          showPanel()
          setError(text.network, [])
        }
      }

      password.addEventListener('input', () => {
        setError('', [])
        updateSubmit()
      })
      confirm.addEventListener('input', () => {
        setError('', [])
        updateSubmit()
      })

      form.addEventListener('submit', async (event) => {
        event.preventDefault()
        if (submitting || !password.value.trim()) {
          return
        }
        if (!configured) {
          if (!confirm.value.trim()) {
            return
          }
          if (password.value !== confirm.value) {
            setError(text.mismatch, [passwordField, confirmField])
            confirm.focus()
            return
          }
        }

        submitting = true
        submit.textContent = text.working
        updateSubmit()
        try {
          const response = await fetch(configured ? '/api/auth/login' : '/api/auth/setup', {
            method: 'POST',
            headers: { 'content-type': 'application/json', accept: 'application/json' },
            body: JSON.stringify({ password: password.value }),
          })
          if (response.ok) {
            location.replace('/')
            return
          }
          if (response.status === 409) {
            await refresh()
          } else if (response.status === 429) {
            setError(text.rateLimited, [])
          } else if (response.status === 401) {
            setError(text.invalid)
            password.select()
          } else {
            setError(configured ? text.invalid : text.setupFailed)
          }
        } catch {
          setError(text.network, [])
        } finally {
          submitting = false
          submit.textContent = configured ? text.button : text.setupButton
          updateSubmit()
        }
      })

      refresh()
    </script>
  </body>
</html>
